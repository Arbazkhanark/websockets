<!DOCTYPE html>
<html>
  <head>
    <title>WebSocket Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      #output {
        margin-top: 15px;
        border: 1px solid #ccc;
        padding: 10px;
        min-height: 100px;
        background: #f9f9f9;
      }
    </style>
  </head>
  <body>
    <h2>💬 WebSocket Chat</h2>

    <!-- Input box for typing messages -->
    <input id="message" placeholder="Type message" />
    <button onclick="sendMessage()">Send</button>

    <!-- Display messages here -->
    <div id="output"></div>

    <script>
      let ws; // WebSocket instance

      // Function to connect to the WebSocket server
      function connect() {
        ws = new WebSocket("ws://localhost:3000");

        // When connected
        ws.onopen = () => {
          console.log("✅ Connected to WebSocket server");
          document.getElementById("output").innerHTML += "<p>✅ Connected!</p>";
        };

        // When a message is received from the server
        ws.onmessage = (event) => {
          console.log("📩 Message received:", event.data);
          document.getElementById("output").innerHTML += `<p>📥 ${event.data}</p>`;
        };

        // When the connection closes, try reconnecting automatically
        ws.onclose = () => {
          console.log("⚠️ Disconnected... trying to reconnect in 2s");
          document.getElementById("output").innerHTML +=
            "<p>⚠️ Connection lost. Reconnecting...</p>";
          setTimeout(connect, 2000); // Auto-reconnect
        };

        // Handle connection errors
        ws.onerror = (error) => {
          console.error("❌ WebSocket Error:", error);
        };
      }

      // Function to send message to server
      function sendMessage() {
        const msg = document.getElementById("message").value;

        // Only send if WebSocket connection is open
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(msg);
          document.getElementById("message").value = "";
          document.getElementById("output").innerHTML += `<p>📤 Sent: ${msg}</p>`;
        } else {
          document.getElementById("output").innerHTML +=
            "<p>⚠️ Connection not open!</p>";
        }
      }

      // Connect to WebSocket server when page loads
      connect();
    </script>
  </body>
</html>
